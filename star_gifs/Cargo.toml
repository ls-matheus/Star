[package]
name = "star-gifs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
star_common = { path = "../star_common" }
anyhow = "1.0.104"
star-svc = { path = "../star_svc", default-features = false }
futures = "0.3"
moka = { version = "0.12.16", features = ["future", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5"
urlencoding = "2.1"
