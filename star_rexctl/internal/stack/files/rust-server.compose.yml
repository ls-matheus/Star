services:
  snowflakes:
    profiles: [split-rust]
  users:
    profiles: [split-rust]
  messages:
    profiles: [split-rust]
  gifs:
    profiles: [split-rust]
  unfurl:
    profiles: [split-rust]
  push:
    profiles: [split-rust]
  app-proxy:
    profiles: [split-rust]
  admin:
    profiles: [split-rust]
  rust:
    image: ${STAR_REGISTRY:-ghcr.io/${STAR_REGISTRY_OWNER:-starapp}}/star-server:${STAR_IMAGE_TAG:-v1}
    restart: ${STAR_RESTART_POLICY:-unless-stopped}
    stop_grace_period: 30s
    networks:
      star:
        aliases: [app-proxy, admin]
    logging:
      driver: json-file
      options:
        max-size: ${STAR_LOG_MAX_SIZE:-10m}
        max-file: "${STAR_LOG_MAX_FILE:-3}"
    deploy:
      resources:
        limits:
          memory: ${STAR_RUST_MEMORY_LIMIT:-1gb}
    environment:
      STAR_RUST_PROCESS: ${STAR_RUST_PROCESS:-}
      STAR_SERVER_SERVICES: snowflakes,users,messages,gifs,unfurl,push,app-proxy,admin
      TOKIO_WORKER_THREADS: ${STAR_RUST_SERVER_TOKIO_WORKER_THREADS:-2}
      MALLOC_ARENA_MAX: ${STAR_MALLOC_ARENA_MAX:-2}
    healthcheck:
      test: ["CMD", "/usr/local/bin/star-server", "healthcheck"]
      interval: ${STAR_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${STAR_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${STAR_APP_HEALTHCHECK_RETRIES:-30}
      start_period: ${STAR_SVC_HEALTHCHECK_START_PERIOD:-60s}
      start_interval: ${STAR_HEALTHCHECK_START_INTERVAL:-1s}
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}
  edge:
    environment:
      STAR_ADMIN_UPSTREAM: ${STAR_ADMIN_UPSTREAM:-admin:18083}
  api:
    depends_on:
      gifs: !reset null
      snowflakes: !reset null
      messages: !reset null
      users: !reset null
      rust: {condition: service_healthy}
  worker:
    depends_on:
      snowflakes: !reset null
      messages: !reset null
      users: !reset null
      rust: {condition: service_healthy}
