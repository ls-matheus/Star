# SPDX-License-Identifier: AGPL-3.0-or-later
id: app.star.StarCanary
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
branch: stable
command: app.star.StarCanary
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=pcsc
  - --device=all
  - --filesystem=xdg-download
  - --filesystem=xdg-run/pipewire-0:ro
  - --filesystem=xdg-run/speech-dispatcher:ro
  - --filesystem=xdg-config/kdeglobals:ro
  - --filesystem=xdg-config/plasmarc:ro
  - --filesystem=xdg-data/plasma/desktoptheme:ro
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.Unity
  - --talk-name=org.ayatana.indicator.application
  - --talk-name=com.canonical.indicator.application
  - --talk-name=org.gnome.Mutter.IdleMonitor
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
build-options:
  strip: false
  no-debuginfo: true
cleanup-commands:
  - rm -f /app/star/chrome-sandbox
modules:
  - name: star
    buildsystem: simple
    build-commands:
      - install -Dm755 app.star.StarCanary.sh ${FLATPAK_DEST}/bin/${FLATPAK_ID}
      - install -d ${FLATPAK_DEST}/share/star
      - printf '%s\n' https://pkgs.star.invalid/flatpak/ > ${FLATPAK_DEST}/share/star/flatpak-repository
      - mkdir -p ${FLATPAK_DEST}/star
      - cp -a app/. ${FLATPAK_DEST}/star/
      - patch-electron-desktop-filename ${FLATPAK_DEST}/star/resources/app.asar
      - install -Dm644 app.star.StarCanary.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 app.star.StarCanary.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 app.star.StarCanary.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
    sources:
      - type: file
        path: app.star.StarCanary.sh
      - type: file
        path: app.star.StarCanary.desktop
      - type: file
        path: app.star.StarCanary.metainfo.xml
      - type: file
        path: app.star.StarCanary.svg
