{{- include "star.validate" . }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: star-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "star.labels" (dict "root" . "name" "star-env" "component" "config") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $val := omit (include "star.secretData" . | fromJson) "STAR_ACTIVITYPUB_SIGNING_KEY_BASE64" }}
  {{ $k }}: {{ $val | b64enc | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: star-unfurl-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "star.labels" (dict "root" . "name" "star-unfurl-env" "component" "config") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- with get (include "star.secretData" . | fromJson) "STAR_ACTIVITYPUB_SIGNING_KEY_BASE64" }}
data:
  STAR_ACTIVITYPUB_SIGNING_KEY_BASE64: {{ . | b64enc | quote }}
{{- end }}
{{- end }}
