      test: ["CMD", "/usr/local/bin/star-media-proxy", "healthcheck"]
      <<: *star-healthcheck
      interval: ${STAR_MEDIA_PROXY_HEALTHCHECK_INTERVAL:-30s}
    depends_on:
      seaweedfs-init: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  push:
    <<: *star-service
    image: ${STAR_REGISTRY:-ghcr.io/${STAR_REGISTRY_OWNER:-starapp}}/star-push:${STAR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${STAR_PUSH_MEMORY_LIMIT:-256mb}
    environment:
      <<: *star-rust-env
      STAR_PUSH_SERVICE_QUEUE_CAPACITY: ${STAR_PUSH_SERVICE_QUEUE_CAPACITY:-}
      STAR_PUSH_SERVICE_SEND_CONCURRENCY: ${STAR_PUSH_SERVICE_SEND_CONCURRENCY:-}
      STAR_PUSH_SERVICE_APNS_BASE_URL: ${STAR_PUSH_SERVICE_APNS_BASE_URL:-}
      STAR_PUSH_SERVICE_FCM_BASE_URL: ${STAR_PUSH_SERVICE_FCM_BASE_URL:-}
      STAR_PUSH_SERVICE_MANAGED_RELAY_HOSTS: ${STAR_PUSH_SERVICE_MANAGED_RELAY_HOSTS:-}
      STAR_PUSH_SERVICE_OWN_RELAY_HOSTS: ${STAR_PUSH_SERVICE_OWN_RELAY_HOSTS:-}
      STAR_PUSH_SERVICE_PRIVATE_HOSTS: ${STAR_PUSH_SERVICE_PRIVATE_HOSTS:-}
      STAR_PUSH_SERVICE_RELAY_CONSENT_ACCEPTED: ${STAR_PUSH_SERVICE_RELAY_CONSENT_ACCEPTED:-}
      STAR_PUSH_APNS_DEFAULT_ENVIRONMENT: ${STAR_PUSH_APNS_DEFAULT_ENVIRONMENT:-}
      STAR_PUSH_FCM_ENABLED: ${STAR_PUSH_FCM_ENABLED:-}
      STAR_PUSH_FCM_PROJECT_ID: ${STAR_PUSH_FCM_PROJECT_ID:-}
      STAR_PUSH_FCM_CLIENT_EMAIL: ${STAR_PUSH_FCM_CLIENT_EMAIL:-}
      STAR_PUSH_FCM_PRIVATE_KEY: ${STAR_PUSH_FCM_PRIVATE_KEY:-}
      STAR_PUSH_FCM_PRIVATE_KEY_PATH: ${STAR_PUSH_FCM_PRIVATE_KEY_PATH:-}
      STAR_PUSH_FCM_SERVICE_ACCOUNT_JSON_PATH: ${STAR_PUSH_FCM_SERVICE_ACCOUNT_JSON_PATH:-}
      STAR_PUSH_FCM_TOKEN_URI: ${STAR_PUSH_FCM_TOKEN_URI:-}
      STAR_PUSH_FCM_APPS: ${STAR_PUSH_FCM_APPS:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/star-push", "healthcheck"]
      <<: *star-app-healthcheck
      start_period: ${STAR_SVC_HEALTHCHECK_START_PERIOD:-60s}
    depends_on:
      nats: {condition: service_healthy}
      api: {condition: service_healthy}

  static-proxy:
    <<: *star-service
    image: ${STAR_REGISTRY:-ghcr.io/${STAR_REGISTRY_OWNER:-starapp}}/star-static:${STAR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${STAR_STATIC_PROXY_MEMORY_LIMIT:-256mb}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/avatars/0.png"]
      <<: *star-healthcheck

  app-proxy:
    <<: *star-service
    image: ${STAR_REGISTRY:-ghcr.io/${STAR_REGISTRY_OWNER:-starapp}}/star-app-proxy-self-hosted:${STAR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${STAR_APP_PROXY_MEMORY_LIMIT:-256mb}
    environment:
      RUST_LOG: ${RUST_LOG:-}
      TOKIO_WORKER_THREADS: ${STAR_TOKIO_WORKER_THREADS:-2}
      STAR_APP_PROXY_PORT: "8080"
      STAR_S3_PUBLIC_ENDPOINT: ${STAR_S3_PUBLIC_ENDPOINT:-}
      STAR_S3_BUCKET_UPLOADS: ${STAR_S3_BUCKET_UPLOADS:-star-uploads}
      STAR_STATIC_CDN_ENDPOINT: ${STAR_STATIC_CDN_ENDPOINT:-}
      STAR_MEDIA_ENDPOINT: ${STAR_MEDIA_ENDPOINT:-}
      STAR_APP_PRODUCT_NAME: ${STAR_APP_PRODUCT_NAME:-}
      STAR_APP_ICON_URL: ${STAR_APP_ICON_URL:-}
      STAR_APP_SYMBOL_URL: ${STAR_APP_SYMBOL_URL:-}
      STAR_APP_LOGO_URL: ${STAR_APP_LOGO_URL:-}
      STAR_APP_WORDMARK_URL: ${STAR_APP_WORDMARK_URL:-}
      STAR_APP_FAVICON_URL: ${STAR_APP_FAVICON_URL:-}
      STAR_APP_FAVICON_DARK_URL: ${STAR_APP_FAVICON_DARK_URL:-}
      STAR_APP_SIGN_IN_BACKDROP_URL: ${STAR_APP_SIGN_IN_BACKDROP_URL:-}
      STAR_APP_THEME_COLOR: ${STAR_APP_THEME_COLOR:-}
      STAR_APP_STATUS_PAGE_URL: ${STAR_APP_STATUS_PAGE_URL:-}
      DISCOVERY_UPSTREAM_URL: http://edge:8088/.well-known/star
      DISCOVERY_REFRESH_INTERVAL_MS: ${DISCOVERY_REFRESH_INTERVAL_MS:-5000}
      STAR_APP_PROXY_INDEX_UPSTREAM_URL: ${STAR_APP_PROXY_INDEX_UPSTREAM_URL:-}
      STAR_APP_PROXY_SAME_ORIGIN_HOSTS: ${STAR_APP_PROXY_SAME_ORIGIN_HOSTS:-}
      STAR_APP_PROXY_MANIFEST_SCOPE_EXTENSIONS: ${STAR_APP_PROXY_MANIFEST_SCOPE_EXTENSIONS:-}
      STAR_LIVEKIT_URL: ${STAR_LIVEKIT_URL:-}
      STAR_CSP_EXTRA_DEFAULT_SRC: ${STAR_CSP_EXTRA_DEFAULT_SRC:-}
      STAR_CSP_EXTRA_CONNECT_SRC: ${STAR_CSP_EXTRA_CONNECT_SRC:-}
      STAR_CSP_EXTRA_IMG_SRC: ${STAR_CSP_EXTRA_IMG_SRC:-}
      STAR_CSP_EXTRA_MEDIA_SRC: ${STAR_CSP_EXTRA_MEDIA_SRC:-}
      STAR_CSP_EXTRA_FONT_SRC: ${STAR_CSP_EXTRA_FONT_SRC:-}
      STAR_CSP_EXTRA_SCRIPT_SRC: ${STAR_CSP_EXTRA_SCRIPT_SRC:-}
      STAR_CSP_EXTRA_STYLE_SRC: ${STAR_CSP_EXTRA_STYLE_SRC:-}
      STAR_CSP_EXTRA_FRAME_SRC: ${STAR_CSP_EXTRA_FRAME_SRC:-}
      STAR_CSP_EXTRA_WORKER_SRC: ${STAR_CSP_EXTRA_WORKER_SRC:-}
      STAR_CSP_EXTRA_MANIFEST_SRC: ${STAR_CSP_EXTRA_MANIFEST_SRC:-}
      STAR_CSP_REPORT_URI: ${STAR_CSP_REPORT_URI:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/_ready"]
      <<: *star-healthcheck
      interval: ${STAR_APP_PROXY_HEALTHCHECK_INTERVAL:-30s}
    depends_on:
      api: {condition: service_healthy}
      edge: {condition: service_healthy}

  snowflakes:
    <<: *star-service
    stop_grace_period: 30s
    image: ${STAR_REGISTRY:-ghcr.io/${STAR_REGISTRY_OWNER:-starapp}}/star-snowflakes:${STAR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${STAR_SNOWFLAKES_MEMORY_LIMIT:-256mb}
    environment:
      <<: *star-rust-env
      STAR_SVC_NAME: snowflakes
      STAR_SVC_MODE: combined
      STAR_SNOWFLAKES_WORKER_GUARD: "true"
    healthcheck: *star-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  users:
    <<: *star-service
    stop_grace_period: 30s
    image: ${STAR_REGISTRY:-ghcr.io/${STAR_REGISTRY_OWNER:-starapp}}/star-users:${STAR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${STAR_USERS_MEMORY_LIMIT:-256mb}
    environment:
      <<: *star-rust-env
      STAR_SVC_NAME: users
      STAR_SVC_MODE: combined
      STAR_POSTGRES_MAX_CONNECTIONS: "${STAR_USERS_POSTGRES_MAX_CONNECTIONS:-20}"
    healthcheck: *star-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}

  gifs:
    <<: *star-service
    stop_grace_period: 30s
    image: ${STAR_REGISTRY:-ghcr.io/${STAR_REGISTRY_OWNER:-starapp}}/star-gifs:${STAR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${STAR_GIFS_MEMORY_LIMIT:-256mb}
    environment:
      <<: *star-rust-env
      STAR_SVC_NAME: gifs
      STAR_SVC_MODE: combined
      STAR_GIFS_SHARD_CACHE_MAX_BYTES: ${STAR_GIFS_SHARD_CACHE_MAX_BYTES:-134217728}
    healthcheck: *star-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  messages:
    <<: *star-service
    stop_grace_period: 30s
    image: ${STAR_REGISTRY:-ghcr.io/${STAR_REGISTRY_OWNER:-starapp}}/star-messages:${STAR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${STAR_MESSAGES_MEMORY_LIMIT:-256mb}
    environment:
      <<: *star-rust-env
      STAR_SVC_NAME: messages
      STAR_SVC_MODE: combined
      STAR_POSTGRES_MAX_CONNECTIONS: "${STAR_MESSAGES_POSTGRES_MAX_CONNECTIONS:-20}"
    healthcheck: *star-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}

  unfurl:
    <<: *star-service
    stop_grace_period: 30s
    image: ${STAR_REGISTRY:-ghcr.io/${STAR_REGISTRY_OWNER:-starapp}}/star-unfurl:${STAR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${STAR_UNFURL_MEMORY_LIMIT:-256mb}
    environment:
      <<: *star-rust-env
      STAR_SVC_NAME: unfurl
      STAR_SVC_MODE: combined
      STAR_MEDIA_PROXY_ENDPOINT: http://media-proxy:8080
      STAR_ACTIVITYPUB_SIGNING_KEY_BASE64: ${STAR_ACTIVITYPUB_SIGNING_KEY_BASE64:-}
    healthcheck: *star-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  admin:
    <<: *star-service
    image: ${STAR_REGISTRY:-ghcr.io/${STAR_REGISTRY_OWNER:-starapp}}/star-admin:${STAR_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${STAR_ADMIN_MEMORY_LIMIT:-256mb}
    environment:
      <<: *star-rust-env
      STAR_ADMIN_PORT: "8080"
      STAR_ADMIN_BASE_PATH: ${STAR_ADMIN_BASE_PATH:-/admin}
      STAR_API_ENDPOINT: http://api:8080
      STAR_API_PUBLIC_ENDPOINT: ${STAR_API_ENDPOINT:-}
      STAR_STATIC_CDN_ENDPOINT: ${STAR_STATIC_CDN_ENDPOINT:-${STAR_PUBLIC_ORIGIN:-${STAR_PUBLIC_SCHEME:-https}://${STAR_DOMAIN:-}}}
      STAR_ADMIN_SSO_CLIENT_SECRET: ${STAR_ADMIN_SSO_CLIENT_SECRET:-}
      STAR_ADMIN_SSO_DISPLAY_NAME: ${STAR_ADMIN_SSO_DISPLAY_NAME:-}
      STAR_ADMIN_SSO_ONLY: ${STAR_ADMIN_SSO_ONLY:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /_health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
      <<: *star-app-healthcheck
      start_period: ${STAR_SVC_HEALTHCHECK_START_PERIOD:-60s}
    depends_on:
      api: {condition: service_healthy}

networks:
  star:
    driver: bridge

volumes:
  edge-data:
  edge-config:
  postgres-data:
  valkey-data:
  nats-data:
  meilisearch-data:
  seaweedfs-data:
  media-proxy-tmp:
