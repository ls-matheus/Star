      retries: ${STAR_SEAWEEDFS_HEALTHCHECK_RETRIES:-20}
      start_period: ${STAR_SEAWEEDFS_HEALTHCHECK_START_PERIOD:-60s}

  seaweedfs-init:
    image: ${STAR_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.52}
    deploy:
      resources:
        limits:
          memory: ${STAR_SEAWEEDFS_INIT_MEMORY_LIMIT:-128mb}
    networks: [star]
    logging: *star-logging
    depends_on:
      seaweedfs: {condition: service_healthy, restart: true}
    restart: "no"
    environment:
      STAR_S3_ACCESS_KEY: ${STAR_S3_ACCESS_KEY:-}
      STAR_S3_SECRET_KEY: ${STAR_S3_SECRET_KEY:-}
      STAR_S3_BUCKET_CDN: ${STAR_S3_BUCKET_CDN:-star}
      STAR_S3_BUCKET_UPLOADS: ${STAR_S3_BUCKET_UPLOADS:-star-uploads}
      STAR_S3_BUCKET_REPORTS: ${STAR_S3_BUCKET_REPORTS:-star-reports}
      STAR_S3_BUCKET_HARVESTS: ${STAR_S3_BUCKET_HARVESTS:-star-harvests}
      STAR_SEAWEEDFS_INIT_ATTEMPTS: ${STAR_SEAWEEDFS_INIT_ATTEMPTS:-60}
      STAR_SEAWEEDFS_UPLOADS_TTL: ${STAR_SEAWEEDFS_UPLOADS_TTL:-1d}
    entrypoint:
      - /bin/sh
      - -c
      - >
        buckets="$$STAR_S3_BUCKET_CDN $$STAR_S3_BUCKET_UPLOADS $$STAR_S3_BUCKET_REPORTS $$STAR_S3_BUCKET_HARVESTS";
        missing="$$buckets";
        for attempt in $$(seq 1 $$STAR_SEAWEEDFS_INIT_ATTEMPTS); do
          if ! nc -z seaweedfs 9333 2>/dev/null; then
            sleep 2;
            continue;
          fi;
          listed=$$(echo "s3.bucket.list" | timeout 10 weed shell -master=seaweedfs:9333 2>&1);
          missing="";
          failure="";
          for b in $$buckets; do
            echo "$$listed" | grep -q "^[[:space:]]*$$b[[:space:]]" || missing="$${missing:+$$missing }$$b";
          done;
          if [ -z "$$missing" ]; then
            if [ "$$STAR_SEAWEEDFS_UPLOADS_TTL" = off ]; then
              ttl_rule="fs.configure -locationPrefix=/buckets/$$STAR_S3_BUCKET_UPLOADS/ -delete -apply";
            else
              ttl_rule="fs.configure -locationPrefix=/buckets/$$STAR_S3_BUCKET_UPLOADS/ -ttl=$$STAR_SEAWEEDFS_UPLOADS_TTL -apply";
            fi;
            failure="could not configure the S3 identity";
            if echo "s3.configure -user=star -access_key=$$STAR_S3_ACCESS_KEY -secret_key=$$STAR_S3_SECRET_KEY -actions=Admin,Read,Write,List,Tagging -apply" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1; then
              failure="could not set the expiry of $$STAR_S3_BUCKET_UPLOADS";
              if echo "$$ttl_rule" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1; then
                echo "buckets ready";
                exit 0;
              fi;
            fi;
            sleep 2;
            continue;
          fi;
          for b in $$missing; do
            echo "s3.bucket.create -name $$b" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1;
          done;
          sleep 2;
        done;
        if [ -n "$$failure" ]; then
          echo "seaweedfs-init $$failure" >&2;
        else
          echo "seaweedfs-init could not verify buckets: $$missing" >&2;
        fi;
        exit 1;

