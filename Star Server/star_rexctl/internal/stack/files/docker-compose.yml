x-star-rust-env: &star-rust-env
  <<: *star-env
  TOKIO_WORKER_THREADS: ${STAR_TOKIO_WORKER_THREADS:-2}
  MALLOC_ARENA_MAX: ${STAR_MALLOC_ARENA_MAX:-2}

x-star-logging: &star-logging
  driver: json-file
  options:
    max-size: ${STAR_LOG_MAX_SIZE:-10m}
    max-file: "${STAR_LOG_MAX_FILE:-3}"

x-star-service: &star-service
  restart: ${STAR_RESTART_POLICY:-unless-stopped}
  networks: [star]
  logging: *star-logging

x-star-healthcheck: &star-healthcheck
  interval: ${STAR_HEALTHCHECK_INTERVAL:-10s}
  timeout: ${STAR_HEALTHCHECK_TIMEOUT:-5s}
  retries: ${STAR_HEALTHCHECK_RETRIES:-10}
  start_period: ${STAR_HEALTHCHECK_START_PERIOD:-60s}
  start_interval: ${STAR_HEALTHCHECK_START_INTERVAL:-1s}

x-star-app-healthcheck: &star-app-healthcheck
  interval: ${STAR_HEALTHCHECK_INTERVAL:-10s}
  timeout: ${STAR_HEALTHCHECK_TIMEOUT:-5s}
  retries: ${STAR_APP_HEALTHCHECK_RETRIES:-30}
  start_period: ${STAR_APP_HEALTHCHECK_START_PERIOD:-90s}
  start_interval: ${STAR_HEALTHCHECK_START_INTERVAL:-1s}

x-star-svc-healthcheck: &star-svc-healthcheck
  <<: *star-app-healthcheck
  start_period: ${STAR_SVC_HEALTHCHECK_START_PERIOD:-60s}
  test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090 && printf \"GET /_health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]

services:
  edge:
    <<: *star-service
    image: ${STAR_CADDY_IMAGE:-caddy:2.11-alpine}
    deploy:
      resources:
        limits:
          memory: ${STAR_CADDY_MEMORY_LIMIT:-384mb}
    ports:
      - "${STAR_EDGE_LISTEN_ADDRESS:+[${STAR_EDGE_LISTEN_ADDRESS}]:}${STAR_HTTP_PORT:-80}:80"
      - "${STAR_EDGE_LISTEN_ADDRESS:+[${STAR_EDGE_LISTEN_ADDRESS}]:}${STAR_HTTPS_PORT:-443}:443"
      - "${STAR_EDGE_LISTEN_ADDRESS:+[${STAR_EDGE_LISTEN_ADDRESS}]:}${STAR_HTTPS_PORT:-443}:443/udp"
    environment:
      STAR_EDGE_SITE_ADDRESS: ${STAR_EDGE_SITE_ADDRESS:-${STAR_CADDY_SITE_ADDRESS:-${STAR_PUBLIC_SCHEME:-https}://${STAR_DOMAIN:-}}}
      STAR_EDGE_TRUSTED_PROXIES: ${STAR_EDGE_TRUSTED_PROXIES:-127.0.0.1/32}
      STAR_EDGE_ENCODE: ${STAR_EDGE_ENCODE:-zstd gzip}
      STAR_EDGE_PROTOCOLS: ${STAR_EDGE_PROTOCOLS:-h1 h2 h3}
      STAR_EDGE_GLOBAL_OPTIONS: ${STAR_EDGE_GLOBAL_OPTIONS:-}
      STAR_EDGE_TLS_DIRECTIVE: ${STAR_EDGE_TLS:+tls ${STAR_EDGE_TLS:-}}
      STAR_ADMIN_BASE_PATH: ${STAR_ADMIN_BASE_PATH:-/admin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - ./certs:/certs:ro,z
      - ./caddy.d:/etc/caddy/conf.d:ro,z
      - edge-data:/data
      - edge-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      <<: *star-healthcheck
    depends_on:
      api: {condition: service_healthy}
      gateway: {condition: service_healthy}

  postgres:
    <<: *star-service
    image: ${STAR_POSTGRES_IMAGE:-postgres:16-alpine}
    deploy:
      resources:
        limits:
          memory: ${STAR_POSTGRES_MEMORY_LIMIT:-5gb}
        reservations:
          memory: ${STAR_POSTGRES_MEMORY_RESERVATION:-3gb}
    command: >
      postgres
      -c max_connections=${STAR_POSTGRES_SERVER_MAX_CONNECTIONS:-150}
      -c shared_buffers=${STAR_POSTGRES_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${STAR_POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      -c work_mem=${STAR_POSTGRES_WORK_MEM:-8MB}
