[package]
name = "star-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "star-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
star_admin = { path = "../star_admin" }
star_app_proxy = { path = "../star_app_proxy" }
star_common = { path = "../star_common", features = ["healthcheck"] }
star-gifs = { path = "../star_gifs" }
star-messages = { path = "../star_messages" }
star-push = { path = "../star_push" }
star-snowflakes = { path = "../star_snowflakes" }
star-svc = { path = "../star_svc" }
star-unfurl = { path = "../star_unfurl" }
star-users = { path = "../star_users" }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
