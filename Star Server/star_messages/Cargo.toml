[package]
name = "star-messages"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
star_common = { path = "../star_common" }
anyhow = "1.0.104"
base64 = "0.23"
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
star-svc = { path = "../star_svc" }
star_markdown_parser = { path = "../packages/markdown_parser/rust" }
futures = "0.3.34"
linkify = "0.11.0"
mime_guess = "2.0.5"
rmp-serde = "1.3"
scylla = { version = "1.9.0", features = ["chrono-04"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
star-svc = { path = "../star_svc", features = ["mock"] }

[features]
default = []
scylla = ["dep:scylla", "star-svc/scylla"]
