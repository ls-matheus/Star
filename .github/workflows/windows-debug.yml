# Star desktop: release (instalador) ou debug (app sem modulo nativo).
name: 'Windows Debug'

on:
  pull_request:
    branches: [main]
    paths:
      - 'Star web/**'
      - '.github/workflows/star-windows-debug.yml'
      - '.github/workflows/star-electron-builder.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: 'Windows Debug'
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CI: 'true'
      BUILD_CHANNEL: development
      BUILD_VERSION: '0.0.${{ github.run_number }}'
      STAR_OFFLINE: '1'
      ELECTRON_ARCH: x64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      STAR_SKIP_NATIVE: 'true'
    defaults:
      run:
        shell: bash
        working-directory: starweb
    steps:
      - name: Checkout Star
        uses: actions/checkout@v4
      - name: Normalizar o caminho sem espacos
        working-directory: .
        run: |
          set -euo pipefail
          test -f 'Star web/Cargo.toml'
          mv 'Star web' starweb
          test -f starweb/star_desktop/package.json
      - name: pnpm 11.27.0
        uses: pnpm/action-setup@v4
        with:
          version: '11.27.0'
          run_install: false
      - name: Node.js 26 e cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: starweb/pnpm-lock.yaml
      - name: Rust 1.98.1 e WebAssembly
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - name: Cache Rust e WebAssembly
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: starweb -> target
          key: windows-debug
      - name: Preparar LLVM WebAssembly no Windows
        run: |
          set -euo pipefail
          if [ ! -x '/c/Program Files/LLVM/bin/clang.exe' ]; then
            choco install llvm -y --no-progress
          fi
          llvm_dir='C:\Program Files\LLVM\bin'
          echo "$llvm_dir" >> "$GITHUB_PATH"
          echo "CC_wasm32_unknown_unknown=$llvm_dir\clang.exe" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$llvm_dir\llvm-ar.exe" >> "$GITHUB_ENV"

      - name: Instalar dependencias do frontend
        run: pnpm install --frozen-lockfile --filter 'star_desktop...' --filter 'star_app...'
      - name: Compilar frontend, WASM e Electron
        env:
          NODE_ENV: production
          PNPM_CONFIG_SHELL_EMULATOR: 'true'
        run: pnpm --filter star_desktop build
      - name: Empacotar aplicativo de teste Windows sem instalador
        env:
          NODE_ENV: production
          PNPM_CONFIG_SHELL_EMULATOR: 'true'
        run: |
          set -euo pipefail
          pnpm --filter star_desktop exec electron-builder             --config ../../.github/workflows/star-electron-builder.cjs             --win --x64 --dir --publish never
          test -d star_desktop/dist-electron/win-unpacked
          test -n "$(find star_desktop/dist-electron/win-unpacked -maxdepth 1 -name '*.exe' -print -quit)"
          powershell.exe -NoProfile -NonInteractive -Command 'Compress-Archive -Path "star_desktop/dist-electron/win-unpacked/*" -DestinationPath ("star_desktop/dist-electron/Star-Windows-Dev-" + $env:GITHUB_RUN_NUMBER + ".zip") -Force'
          test -s "star_desktop/dist-electron/Star-Windows-Dev-${GITHUB_RUN_NUMBER}.zip"
      - name: Baixar teste Windows ZIP com EXE
        uses: actions/upload-artifact@v4
        with:
          name: Star-Windows-Debug-App-${{ github.run_number }}
          path: starweb/star_desktop/dist-electron/Star-Windows-Dev-*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

