# Star GHCR: publish executable server, compiled web assets and Android builder.
# Build jobs use the existing Dockerfiles. A green build is not E2E production approval.
name: Docker Images (GHCR)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'Docker/**'
      - 'Star Server/**'
      - 'Star web/**'
      - 'Star mobile/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'
      - 'Docker/**'
      - 'Star Server/**'
      - 'Star web/**'
      - 'Star mobile/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Docker files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate scripts and Compose
        shell: bash
        run: |
          set -euo pipefail
          bash -n Docker/star.sh Docker/INICIAR-STAR.command Docker/scripts/build-android.sh
          test -f 'Star Server/packaging/monolith/Dockerfile'
          test -f 'Star web/star_app_proxy/Dockerfile'
          test -f 'Star mobile/pubspec.yaml'
          if git ls-files --error-unmatch Docker/.env >/dev/null 2>&1; then
            echo 'ERROR: local Docker/.env must never be committed' >&2
            exit 1
          fi
          cp Docker/.env.example Docker/.env
          docker compose -f Docker/compose.yaml config --quiet
          docker compose -f Docker/compose.ghcr.yaml config --quiet
          rm Docker/.env
          echo 'Static validation passed. Actual image builds run in publish jobs.'

  publish:
    name: Publish ${{ matrix.component }} (amd64)
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            context: './Star Server'
            dockerfile: './Star Server/packaging/monolith/Dockerfile'
            target: runtime
            build_args: |
              SOURCE=export
              PROFILE=release-fast
              CARGO_BUILD_JOBS=2
          - component: web-assets
            context: './Star web'
            dockerfile: './Star web/star_app_proxy/Dockerfile'
            target: app-assets
            build_args: |
              BUNDLE_LOCAL_ASSETS=true
              PUBLIC_ASSET_BASE_URL=
          - component: mobile-builder
            context: './Docker'
            dockerfile: './Docker/Dockerfile.mobile'
            target: ''
            build_args: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/star-${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.build_args }}
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=min
          provenance: true
