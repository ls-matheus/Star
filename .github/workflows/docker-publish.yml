          COMPONENT: server
        run: bash Docker/scripts/publish-docker-release.sh


  archive-backfill:
    name: Maintenance / restore archives (${{ matrix.component }})
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'backfill'
    needs: [validate, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        component: [web-assets, desktop-renderer, mobile-builder]
    permissions:
      contents: write
      packages: read
    steps:
      - name: Validate existing Release selection
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[[:xdigit:]]{8,40}$ ]] || {
            echo "Supply release_sha, e.g. 2aa31175, when target=backfill" >&2
            exit 2
          }
      - name: Checkout exporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export original immutable image to existing GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          COMPONENT: ${{ matrix.component }}
        run: bash Docker/scripts/publish-docker-release.sh

  dmg:
    if: github.event_name != 'pull_request'
    needs: desktop-image
    name: Package / macOS DMG and ZIP (x64)
    runs-on: macos-15-intel
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      CI: 'true'
      BUILD_CHANNEL: stable
      BUILD_VERSION: '0.0.${{ github.run_number }}'
      STAR_OFFLINE: '1'
      ELECTRON_ARCH: x64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      STAR_SKIP_NATIVE: 'false'
    defaults:
      run:
        shell: bash
        working-directory: starweb
    steps:
      - name: Checkout Star
        uses: actions/checkout@v4
      - name: Normalizar o caminho sem espacos
        working-directory: .
        run: |
          set -euo pipefail
          test -f 'Star web/Cargo.toml'
          mv 'Star web' starweb
          test -f starweb/star_desktop/package.json
      - name: pnpm 11.27.0
        uses: pnpm/action-setup@v4
        with:
          version: '11.27.0'
          run_install: false
      - name: Node.js 26 e cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: starweb/pnpm-lock.yaml
      - name: Rust 1.98.1 e WebAssembly
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - name: Cache Rust e WebAssembly
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: starweb -> target
          key: macos-release
      - name: Preparar LLVM WebAssembly no macOS
        run: |
          set -euo pipefail
          brew list --versions llvm >/dev/null 2>&1 || brew install llvm
          llvm_bin="$(brew --prefix llvm)/bin"
          echo "$llvm_bin" >> "$GITHUB_PATH"
          echo "CC_wasm32_unknown_unknown=$llvm_bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$llvm_bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Instalar dependencias do frontend
        run: pnpm install --frozen-lockfile --filter 'star_desktop...' --filter 'star_app...'
      - name: Download renderer exported from published Docker image
        uses: actions/download-artifact@v4
        with:
          name: star-desktop-renderer
          path: ${{ runner.temp }}/star-desktop-renderer

      - name: Install shared renderer from OCI image
        run: |
          set -euo pipefail
          mkdir -p star_desktop/dist/renderer
          tar -xzf "$RUNNER_TEMP/star-desktop-renderer/desktop-renderer.tar.gz" -C star_desktop/dist/renderer
          test -s star_desktop/dist/renderer/index.html
          test -s star_desktop/dist/renderer/version.json
          test -d star_desktop/dist/renderer/assets

      - name: Compilar frontend, WASM e Electron
        env:
          NODE_ENV: production
          PNPM_CONFIG_SHELL_EMULATOR: 'false'
        run: |
          set -euo pipefail
          # Renderer was compiled by the published Docker image, not rebuilt.
          pnpm --filter star_desktop build --use-shared-renderer
      - name: Empacotar DMG e ZIP Mac Intel
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          pnpm --filter star_desktop exec electron-builder             --config ../../.github/workflows/star-electron-builder.cjs             --mac dmg zip --x64 --publish never
      - name: Disponibilizar instaladores macOS
        uses: actions/upload-artifact@v4
        with:
          name: Star-macOS-Intel-DMG-${{ github.run_number }}
          path: |
            starweb/star_desktop/dist-electron/*.dmg
            starweb/star_desktop/dist-electron/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Release / attach native installers and verify
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(star_desktop/dist-electron/*.dmg star_desktop/dist-electron/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'Instaladores ausentes. Release nao criada.' >&2
            exit 1
          fi
          tag="star-build-${GITHUB_SHA:0:8}"
          gh release view "$tag" >/dev/null || {
            echo "Artifacts Release is missing: $tag" >&2
            exit 1
          }
          gh release upload "$tag" "${assets[@]}" --clobber
          published="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            grep -Fxq "$(basename "$asset")" <<< "$published"
          done
          echo "Verificado na GitHub Release: https://github.com/$GH_REPO/releases/tag/$tag"

  exe:
    if: github.event_name != 'pull_request'
    needs: desktop-image
    name: Package / Windows EXE (x64)
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      CI: 'true'
      BUILD_CHANNEL: stable
      BUILD_VERSION: '0.0.${{ github.run_number }}'
      STAR_OFFLINE: '1'
      ELECTRON_ARCH: x64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      STAR_SKIP_NATIVE: 'false'
    defaults:
      run:
        shell: bash
        working-directory: starweb
    steps:
      - name: Checkout Star
        uses: actions/checkout@v4
      - name: Normalizar o caminho sem espacos
        working-directory: .
        run: |
          set -euo pipefail
          test -f 'Star web/Cargo.toml'
          mv 'Star web' starweb
          test -f starweb/star_desktop/package.json
      - name: pnpm 11.27.0
        uses: pnpm/action-setup@v4
        with:
          version: '11.27.0'
          run_install: false
      - name: Node.js 26 e cache pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: starweb/pnpm-lock.yaml
      - name: Rust 1.98.1 e WebAssembly
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - name: Cache Rust e WebAssembly
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: starweb -> target
          key: windows-release
      - name: Preparar LLVM WebAssembly no Windows
        run: |
          set -euo pipefail
          if [ ! -x '/c/Program Files/LLVM/bin/clang.exe' ]; then
            choco install llvm -y --no-progress
          fi
          llvm_dir='C:\Program Files\LLVM\bin'
          echo "$llvm_dir" >> "$GITHUB_PATH"
          echo "CC_wasm32_unknown_unknown=$llvm_dir\clang.exe" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$llvm_dir\llvm-ar.exe" >> "$GITHUB_ENV"

      - name: Instalar dependencias do frontend
        run: pnpm install --frozen-lockfile --filter 'star_desktop...' --filter 'star_app...'
      - name: Download renderer exported from published Docker image
        uses: actions/download-artifact@v4
        with:
          name: star-desktop-renderer
          path: ${{ runner.temp }}/star-desktop-renderer

      - name: Install shared renderer from OCI image
        run: |
          set -euo pipefail
          mkdir -p star_desktop/dist/renderer
          # Git Bash reports RUNNER_TEMP as a Windows drive path (D:\...), and
          # GNU tar treats its colon as a remote host unless we convert it.
          archive="$(cygpath -u "$RUNNER_TEMP")/star-desktop-renderer/desktop-renderer.tar.gz"
          test -s "$archive"
          tar -xzf "$archive" -C star_desktop/dist/renderer
          test -s star_desktop/dist/renderer/index.html
          test -s star_desktop/dist/renderer/version.json
          test -d star_desktop/dist/renderer/assets

      - name: Compilar frontend, WASM e Electron
        env:
          NODE_ENV: production
          PNPM_CONFIG_SHELL_EMULATOR: 'true'
        run: |
          set -euo pipefail
          # Renderer was compiled by the published Docker image, not rebuilt.
          pnpm --filter star_desktop build --use-shared-renderer
      - name: Empacotar EXE Windows
        env:
          NODE_ENV: production
          PNPM_CONFIG_SHELL_EMULATOR: 'true'
        run: |
          set -euo pipefail
          pnpm --filter star_desktop exec electron-builder             --config ../../.github/workflows/star-electron-builder.cjs             --win nsis portable --x64 --publish never
      - name: Disponibilizar EXE Windows
        uses: actions/upload-artifact@v4
        with:
          name: Star-Windows-EXE-${{ github.run_number }}
          path: starweb/star_desktop/dist-electron/*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Release / attach native installers and verify
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(star_desktop/dist-electron/*.exe)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'Instaladores ausentes. Release nao criada.' >&2
            exit 1
          fi
          tag="star-build-${GITHUB_SHA:0:8}"
          gh release view "$tag" >/dev/null || {
            echo "Artifacts Release is missing: $tag" >&2
            exit 1
          }
          gh release upload "$tag" "${assets[@]}" --clobber
          published="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            grep -Fxq "$(basename "$asset")" <<< "$published"
          done
          echo "Verificado na GitHub Release: https://github.com/$GH_REPO/releases/tag/$tag"
