# The ONE Star workflow: independent image builds plus APK/DMG/EXE.
# Server is an opt-in/changed-files job, never a dependency of app builds.
name: Star | Build and release
run-name: "Star / ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'automatic' }} / #${{ github.run_number }}"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/star-electron-builder.cjs'
      - 'Docker/**'
      - 'Star web/**'
      - 'Star mobile/**'
      - 'Star Server/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/star-electron-builder.cjs'
      - 'Docker/**'
      - 'Star web/**'
      - 'Star mobile/**'
      - 'Star Server/**'
  workflow_dispatch:
    inputs:
      target:
        description: "What to build? Server stays independent of apps."
        required: true
        type: choice
        default: apps
        options: [apps, server, all, backfill, plan]
      force_rebuild:
        description: "Ignore cache and rebuild selected components"
        required: false
        type: boolean
        default: false
      release_sha:
        description: "Existing release commit SHA for backfill (first 8 hex chars)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  detect:
    name: CI / incremental plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      apps: ${{ steps.flags.outputs.apps }}
      server: ${{ steps.flags.outputs.server }}
      base_tag: ${{ steps.flags.outputs.base_tag }}
      build_web: ${{ steps.flags.outputs.build_web }}
      build_desktop: ${{ steps.flags.outputs.build_desktop }}
      build_mobile: ${{ steps.flags.outputs.build_mobile }}
      build_server: ${{ steps.flags.outputs.build_server }}
      build_apk: ${{ steps.flags.outputs.build_apk }}
      build_mac: ${{ steps.flags.outputs.build_mac }}
      build_windows: ${{ steps.flags.outputs.build_windows }}
      desktop_cache: ${{ steps.flags.outputs.desktop_cache }}
      mobile_image_ref: ${{ steps.flags.outputs.mobile_image_ref }}
      desktop_image_ref: ${{ steps.flags.outputs.desktop_image_ref }}
    steps:
      - name: Checkout full history for content fingerprints
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare with published immutable build cache
        id: flags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAR_TARGET: ${{ inputs.target || 'apps' }}
          STAR_BEFORE: ${{ github.event.before }}
          STAR_FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: python3 Docker/scripts/star-incremental.py plan

  validate:
    name: CI / validate source and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate source and Compose
        shell: bash
        run: |
          set -euo pipefail
          bash -n Docker/star.sh Docker/INICIAR-STAR.command Docker/scripts/build-android.sh
          bash -n Docker/scripts/publish-docker-release.sh Docker/scripts/prepare-releases.sh
          python3 -m py_compile Docker/scripts/star-incremental.py Docker/scripts/publish-image-manifest.py
          python3 -m unittest discover -s Docker/tests -p 'test_*.py' -v
          grep -q 'AS desktop-renderer' 'Star web/star_app_proxy/Dockerfile'
          test -f 'Star mobile/pubspec.yaml'
          test -f 'Star Server/packaging/monolith/Dockerfile'
          if git ls-files --error-unmatch Docker/.env >/dev/null 2>&1; then
            echo 'Do not commit private Docker/.env' >&2
            exit 1
          fi
          cp Docker/.env.example Docker/.env
          trap 'rm -f Docker/.env' EXIT
          docker compose -f Docker/compose.yaml config --quiet
          docker compose -f Docker/compose.ghcr.yaml config --quiet
          echo 'Configuration and syntax verified.'

  prepare-release:
    name: Release / create artifacts and metadata
    if: github.event_name != 'pull_request' && inputs.target != 'backfill' && inputs.target != 'plan'
    needs: [validate, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release preparation scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare artifact and metadata Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: bash Docker/scripts/prepare-releases.sh

  web-image:
    name: GHCR / web assets
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.build_web == 'true' }}
    needs: [prepare-release, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable and latest tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/star-web-assets
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push component
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: './Star web'
          file: './Star web/star_app_proxy/Dockerfile'
          target: app-assets
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUNDLE_LOCAL_ASSETS=true
            PUBLIC_ASSET_BASE_URL=
            BUILD_VERSION=0.0.${{ github.run_number }}
          cache-from: type=gha,scope=web-assets
          cache-to: type=gha,scope=web-assets,mode=max
          provenance: true

      - name: Release / publish verified OCI manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: web-assets
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: python3 Docker/scripts/publish-image-manifest.py

  desktop-image:
    name: GHCR / desktop renderer
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.build_desktop == 'true' }}
    needs: [prepare-release, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable and latest tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/star-desktop-renderer
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push component
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: './Star web'
          file: './Star web/star_app_proxy/Dockerfile'
          target: desktop-renderer
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=0.0.${{ github.run_number }}
          cache-from: type=gha,scope=desktop-renderer
          cache-to: type=gha,scope=desktop-renderer,mode=max
          provenance: true

      - name: Release / publish verified OCI manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: desktop-renderer
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: python3 Docker/scripts/publish-image-manifest.py

      # Native DMG/EXE jobs cannot run Linux containers. Transfer the renderer
      # from its immutable OCI image to the native packaging runners.
      - name: Extract desktop renderer from published OCI image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/star-desktop-renderer@${IMAGE_DIGEST}"
          docker pull "$image"
          cid="$(docker create "$image")"
          trap 'docker rm "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$RUNNER_TEMP/desktop-renderer"
          docker cp "$cid:/renderer/." "$RUNNER_TEMP/desktop-renderer/"
          test -s "$RUNNER_TEMP/desktop-renderer/index.html"
          test -s "$RUNNER_TEMP/desktop-renderer/version.json"
          test -d "$RUNNER_TEMP/desktop-renderer/assets"
          tar -czf "$RUNNER_TEMP/desktop-renderer.tar.gz" -C "$RUNNER_TEMP/desktop-renderer" .

      - name: Export compiled renderer for macOS and Windows jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: star-desktop-renderer
          path: ${{ runner.temp }}/desktop-renderer.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  desktop-cache:
    name: Cache / reuse unchanged desktop renderer
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.desktop_cache == 'true' && needs.prepare-release.result == 'success' }}
    needs: [detect, prepare-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract renderer from cached immutable OCI image
        env:
          DESKTOP_IMAGE_REF: ${{ needs.detect.outputs.desktop_image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          image="$DESKTOP_IMAGE_REF"
          [[ "$image" =~ ^ghcr\.io/[a-z0-9_.-]+/star-desktop-renderer@sha256:[[:xdigit:]]{64}$ ]] || {
            echo "Invalid cached image reference: $image" >&2
            exit 2
          }
          docker pull --platform linux/amd64 "$image"
          cid="$(docker create "$image")"
          trap 'docker rm "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$RUNNER_TEMP/desktop-renderer"
          docker cp "$cid:/renderer/." "$RUNNER_TEMP/desktop-renderer/"
          test -s "$RUNNER_TEMP/desktop-renderer/index.html"
          test -s "$RUNNER_TEMP/desktop-renderer/version.json"
          test -d "$RUNNER_TEMP/desktop-renderer/assets"
          tar -czf "$RUNNER_TEMP/desktop-renderer.tar.gz" -C "$RUNNER_TEMP/desktop-renderer" .
      - name: Make cached renderer available to native packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: star-desktop-renderer
          path: ${{ runner.temp }}/desktop-renderer.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  mobile-image:
    name: GHCR / Android builder
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.build_mobile == 'true' }}
    needs: [prepare-release, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable and latest tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/star-mobile-builder
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push component
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: './Docker'
          file: './Docker/Dockerfile.mobile'
          target: ''
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=0.0.${{ github.run_number }}
          cache-from: type=gha,scope=mobile-builder
          cache-to: type=gha,scope=mobile-builder,mode=max
          provenance: true

      - name: Release / publish verified OCI manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: mobile-builder
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: python3 Docker/scripts/publish-image-manifest.py

  server-image:
    name: GHCR / server
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.build_server == 'true' }}
    needs: [prepare-release, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable and latest tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/star-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push component
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: './Star Server'
          file: './Star Server/packaging/monolith/Dockerfile'
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE=export
            PROFILE=release-fast
            CARGO_BUILD_JOBS=2
            BUILD_VERSION=0.0.${{ github.run_number }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
          provenance: true

      - name: Release / publish verified OCI manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: server
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: python3 Docker/scripts/publish-image-manifest.py

  apk:
    name: Package / Android APK (ARM64)
    if: ${{ always() && github.event_name != 'pull_request' && needs.detect.outputs.build_apk == 'true' && needs.prepare-release.result == 'success' && (needs.mobile-image.result == 'success' || needs.mobile-image.result == 'skipped') }}
    needs: [detect, prepare-release, mobile-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Restore Gradle, Dart and Cargo build caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/star-apk-cache
          key: star-android-v1-${{ runner.os }}-${{ hashFiles('Star mobile/pubspec.lock', 'Star web/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            star-android-v1-${{ runner.os }}-${{ hashFiles('Star mobile/pubspec.lock', 'Star web/Cargo.lock') }}-
            star-android-v1-${{ runner.os }}-

      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Android APK inside published image
        env:
          MOBILE_IMAGE_REF: ${{ needs.detect.outputs.mobile_image_ref }}
        shell: bash
        run: |
          set -euo pipefail
          image="$MOBILE_IMAGE_REF"
          [[ "$image" == ghcr.io/*/star-mobile-builder:* || "$image" == ghcr.io/*/star-mobile-builder@sha256:* ]] || exit 2
          docker pull "$image"
          mkdir -p "$RUNNER_TEMP/star-apk" "$RUNNER_TEMP/star-apk-cache"
          docker run --rm --platform linux/amd64 \
            -e CI=true -e FLUTTER_SUPPRESS_ANALYTICS=true \
            -e PUB_CACHE=/cache/pub -e GRADLE_USER_HOME=/cache/gradle \
            -e CARGO_TARGET_DIR=/cache/cargo \
            -v "$GITHUB_WORKSPACE/Star mobile:/source:ro" \
            -v "$GITHUB_WORKSPACE/Star web:/source-web:ro" \
            -v "$RUNNER_TEMP/star-apk-cache:/cache" \
            -v "$RUNNER_TEMP/star-apk:/output" \
            "$image"
          test -s "$RUNNER_TEMP/star-apk/Star-Android-ARM64-DEBUG.apk"

      - name: Save Gradle, Dart and Cargo caches for future changes
        if: success()
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/star-apk-cache
          key: star-android-v1-${{ runner.os }}-${{ hashFiles('Star mobile/pubspec.lock', 'Star web/Cargo.lock') }}-${{ github.run_id }}

      - name: Save downloadable APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Star-Android-ARM64-DEBUG
          path: ${{ runner.temp }}/star-apk/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Add APK to same GitHub Release immediately
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="star-build-${GITHUB_SHA:0:8}"
          gh release upload "$tag" "$RUNNER_TEMP/star-apk/Star-Android-ARM64-DEBUG.apk" --clobber
          gh release view "$tag" --json assets --jq '.assets[].name' |
            grep -Fxq 'Star-Android-ARM64-DEBUG.apk'
          echo "Verified debug APK in GitHub Release $tag" >> "$GITHUB_STEP_SUMMARY"

  archive-web-assets:
    name: Release / Docker image - web
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.build_web == 'true' }}
    needs: [web-image, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout release exporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export compressed Docker image and upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: web-assets
        run: bash Docker/scripts/publish-docker-release.sh

  archive-desktop-renderer:
    name: Release / Docker image - desktop
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.build_desktop == 'true' }}
    needs: [desktop-image, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout release exporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export compressed Docker image and upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: desktop-renderer
        run: bash Docker/scripts/publish-docker-release.sh

  archive-mobile-builder:
    name: Release / Docker image - Android
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.build_mobile == 'true' }}
    needs: [mobile-image, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout release exporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export compressed Docker image and upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: mobile-builder
        run: bash Docker/scripts/publish-docker-release.sh

  archive-server:
    name: Release / Docker image - server
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.build_server == 'true' }}
    needs: [server-image, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout release exporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export compressed Docker image and upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: server
        run: bash Docker/scripts/publish-docker-release.sh


  archive-backfill:
    name: Maintenance / restore archives (${{ matrix.component }})
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'backfill'
    needs: [validate, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        component: [web-assets, desktop-renderer, mobile-builder]
    permissions:
      contents: write
      packages: read
    steps:
      - name: Validate existing Release selection
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[[:xdigit:]]{8,40}$ ]] || {
            echo "Supply release_sha, e.g. 2aa31175, when target=backfill" >&2
            exit 2
          }
      - name: Checkout exporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export original immutable image to existing GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          COMPONENT: ${{ matrix.component }}
        run: bash Docker/scripts/publish-docker-release.sh

  dmg:
    if: ${{ always() && github.event_name != 'pull_request' && needs.detect.outputs.build_mac == 'true' && needs.prepare-release.result == 'success' && (needs.desktop-image.result == 'success' || needs.desktop-cache.result == 'success') }}
    needs: [detect, prepare-release, desktop-image, desktop-cache]
    name: Package / macOS DMG and ZIP (x64)
    runs-on: macos-15-intel
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      CI: 'true'
      BUILD_CHANNEL: stable
      BUILD_VERSION: '0.0.${{ github.run_number }}'
      STAR_OFFLINE: '1'
      ELECTRON_ARCH: x64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      STAR_SKIP_NATIVE: 'false'
    defaults:
      run:
        shell: bash
        working-directory: starweb
    steps:
      - name: Check out Star source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Normalize web workspace directory
        working-directory: .
        run: |
          set -euo pipefail
          test -f 'Star web/Cargo.toml'
          mv 'Star web' starweb
          test -f starweb/star_desktop/package.json
      - name: Set up pnpm 11.27.0
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.27.0'
          run_install: false
      - name: Set up Node.js 26 and pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: starweb/pnpm-lock.yaml
      - name: Set up Rust 1.98.1 with WebAssembly
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: starweb -> target
          key: macos-release
      - name: Configure LLVM for WebAssembly on macOS
        run: |
          set -euo pipefail
          brew list --versions llvm >/dev/null 2>&1 || brew install llvm
          llvm_bin="$(brew --prefix llvm)/bin"
          echo "$llvm_bin" >> "$GITHUB_PATH"
          echo "CC_wasm32_unknown_unknown=$llvm_bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$llvm_bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --filter 'star_desktop...' --filter 'star_app...'
      - name: Download compiled desktop renderer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: star-desktop-renderer
          path: ${{ runner.temp }}/star-desktop-renderer

      - name: Install verified renderer assets
        run: |
          set -euo pipefail
          mkdir -p star_desktop/dist/renderer
          tar -xzf "$RUNNER_TEMP/star-desktop-renderer/desktop-renderer.tar.gz" -C star_desktop/dist/renderer
          test -s star_desktop/dist/renderer/index.html
          test -s star_desktop/dist/renderer/version.json
          test -d star_desktop/dist/renderer/assets

      - name: Compile frontend, WASM, and Electron
        env:
          NODE_ENV: production
          PNPM_CONFIG_SHELL_EMULATOR: 'false'
        run: |
          set -euo pipefail
          # Renderer was compiled by the published Docker image, not rebuilt.
          pnpm --filter star_desktop build --use-shared-renderer
      - name: Package macOS Intel DMG and ZIP
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          pnpm --filter star_desktop exec electron-builder             --config ../../.github/workflows/star-electron-builder.cjs             --mac dmg zip --x64 --publish never
      - name: Save macOS installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Star-macOS-Intel-DMG-${{ github.run_number }}
          path: |
            starweb/star_desktop/dist-electron/*.dmg
            starweb/star_desktop/dist-electron/*.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish and verify native installers
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(star_desktop/dist-electron/*.dmg star_desktop/dist-electron/*.zip)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'Instaladores ausentes. Release nao criada.' >&2
            exit 1
          fi
          tag="star-build-${GITHUB_SHA:0:8}"
          gh release view "$tag" >/dev/null || {
            echo "Artifacts Release is missing: $tag" >&2
            exit 1
          }
          gh release upload "$tag" "${assets[@]}" --clobber
          published="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            grep -Fxq "$(basename "$asset")" <<< "$published"
          done
          echo "Verificado na GitHub Release: https://github.com/$GH_REPO/releases/tag/$tag"

  exe:
    if: ${{ always() && github.event_name != 'pull_request' && needs.detect.outputs.build_windows == 'true' && needs.prepare-release.result == 'success' && (needs.desktop-image.result == 'success' || needs.desktop-cache.result == 'success') }}
    needs: [detect, prepare-release, desktop-image, desktop-cache]
    name: Package / Windows EXE (x64)
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      CI: 'true'
      BUILD_CHANNEL: stable
      BUILD_VERSION: '0.0.${{ github.run_number }}'
      STAR_OFFLINE: '1'
      ELECTRON_ARCH: x64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      STAR_SKIP_NATIVE: 'false'
    defaults:
      run:
        shell: bash
        working-directory: starweb
    steps:
      - name: Check out Star source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Normalize web workspace directory
        working-directory: .
        run: |
          set -euo pipefail
          test -f 'Star web/Cargo.toml'
          mv 'Star web' starweb
          test -f starweb/star_desktop/package.json
      - name: Set up pnpm 11.27.0
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.27.0'
          run_install: false
      - name: Set up Node.js 26 and pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: starweb/pnpm-lock.yaml
      - name: Set up Rust 1.98.1 with WebAssembly
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.98.1'
          targets: wasm32-unknown-unknown
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: starweb -> target
          key: windows-release
      - name: Configure LLVM for WebAssembly on Windows
        run: |
          set -euo pipefail
          if [ ! -x '/c/Program Files/LLVM/bin/clang.exe' ]; then
            choco install llvm -y --no-progress
          fi
          llvm_dir='C:\Program Files\LLVM\bin'
          echo "$llvm_dir" >> "$GITHUB_PATH"
          echo "CC_wasm32_unknown_unknown=$llvm_dir\clang.exe" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$llvm_dir\llvm-ar.exe" >> "$GITHUB_ENV"

      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile --filter 'star_desktop...' --filter 'star_app...'
      - name: Download compiled desktop renderer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: star-desktop-renderer
          path: ${{ runner.temp }}/star-desktop-renderer

      - name: Install verified renderer assets
        run: |
          set -euo pipefail
          mkdir -p star_desktop/dist/renderer
          # Git Bash reports RUNNER_TEMP as a Windows drive path (D:\...), and
          # GNU tar treats its colon as a remote host unless we convert it.
          archive="$(cygpath -u "$RUNNER_TEMP")/star-desktop-renderer/desktop-renderer.tar.gz"
          test -s "$archive"
          tar -xzf "$archive" -C star_desktop/dist/renderer
          test -s star_desktop/dist/renderer/index.html
          test -s star_desktop/dist/renderer/version.json
          test -d star_desktop/dist/renderer/assets

      - name: Compile frontend, WASM, and Electron
        env:
          NODE_ENV: production
          PNPM_CONFIG_SHELL_EMULATOR: 'true'
        run: |
          set -euo pipefail
          # Renderer was compiled by the published Docker image, not rebuilt.
          pnpm --filter star_desktop build --use-shared-renderer
      - name: Package Windows x64 executable
        env:
          NODE_ENV: production
          PNPM_CONFIG_SHELL_EMULATOR: 'true'
        run: |
          set -euo pipefail
          pnpm --filter star_desktop exec electron-builder             --config ../../.github/workflows/star-electron-builder.cjs             --win nsis portable --x64 --publish never
      - name: Save Windows executable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Star-Windows-EXE-${{ github.run_number }}
          path: starweb/star_desktop/dist-electron/*.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish and verify native installers
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(star_desktop/dist-electron/*.exe)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'Instaladores ausentes. Release nao criada.' >&2
            exit 1
          fi
          tag="star-build-${GITHUB_SHA:0:8}"
          gh release view "$tag" >/dev/null || {
            echo "Artifacts Release is missing: $tag" >&2
            exit 1
          }
          gh release upload "$tag" "${assets[@]}" --clobber
          published="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          for asset in "${assets[@]}"; do
            grep -Fxq "$(basename "$asset")" <<< "$published"
          done
          echo "Verificado na GitHub Release: https://github.com/$GH_REPO/releases/tag/$tag"

  finalize-cache:
    name: Cache / record immutable baseline and reused downloads
    if: ${{ always() && github.event_name != 'pull_request' && inputs.target != 'backfill' && inputs.target != 'plan' && needs.prepare-release.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs:
      - detect
      - prepare-release
      - web-image
      - desktop-image
      - mobile-image
      - server-image
      - desktop-cache
      - apk
      - dmg
      - exe
      - archive-web-assets
      - archive-desktop-renderer
      - archive-mobile-builder
      - archive-server
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout commit and history for cache provenance
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record output fingerprints, digests and immutable download links
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAR_BASE_TAG: ${{ needs.detect.outputs.base_tag }}
          STAR_BUILT_WEB: ${{ needs.detect.outputs.build_web }}
          STAR_BUILT_DESKTOP: ${{ needs.detect.outputs.build_desktop }}
          STAR_BUILT_MOBILE: ${{ needs.detect.outputs.build_mobile }}
          STAR_BUILT_SERVER: ${{ needs.detect.outputs.build_server }}
          STAR_BUILT_APK: ${{ needs.detect.outputs.build_apk }}
          STAR_BUILT_MAC: ${{ needs.detect.outputs.build_mac }}
          STAR_BUILT_WINDOWS: ${{ needs.detect.outputs.build_windows }}
          STAR_SCOPE_APPS: ${{ needs.detect.outputs.apps }}
          STAR_SCOPE_SERVER: ${{ needs.detect.outputs.server }}
        run: python3 Docker/scripts/star-incremental.py finalize
