# The ONE Star workflow: independent image builds plus APK/DMG/EXE.
# Server is an opt-in/changed-files job, never a dependency of app builds.
name: Star | Build & Release
run-name: "Star / ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'automatic' }} / #${{ github.run_number }}"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/star-electron-builder.cjs'
      - 'Docker/**'
      - 'Star web/**'
      - 'Star mobile/**'
      - 'Star Server/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/star-electron-builder.cjs'
      - 'Docker/**'
      - 'Star web/**'
      - 'Star mobile/**'
      - 'Star Server/**'
  workflow_dispatch:
    inputs:
      target:
        description: "What to build? Server stays independent of apps."
        required: true
        type: choice
        default: apps
        options: [apps, server, all, backfill]
      release_sha:
        description: "Existing release commit SHA for backfill (first 8 hex chars)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  detect:
    name: CI / select build scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.flags.outputs.apps }}
      server: ${{ steps.flags.outputs.server }}
    steps:
      - name: Checkout full history for changed-file detection
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Choose build targets
        id: flags
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SELECTED: ${{ inputs.target || 'apps' }}
        run: |
          set -euo pipefail
          apps=false
          server=false
          if [[ "$EVENT" == 'workflow_dispatch' ]]; then
            case "$SELECTED" in
              apps) apps=true ;;
              server) server=true ;;
              all) apps=true; server=true ;;
              backfill) : ;;
              *) echo "Invalid build target: $SELECTED" >&2; exit 2 ;;
            esac
          elif [[ "$EVENT" == 'push' ]]; then
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              changes="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
            else
              changes="$(git ls-tree -r --name-only "$GITHUB_SHA")"
            fi
            while IFS= read -r file; do
              case "$file" in
                "Star Server/"*) server=true ;;
                "Star web/"*|"Star mobile/"*|"Docker/"*|".github/workflows/"*)
                  apps=true ;;
              esac
            done <<< "$changes"
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          printf "## Escopo da execucao\n\n- Apps: %s\n- Server: %s\n" "$apps" "$server" >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: CI / validate source and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate source and Compose
        shell: bash
        run: |
          set -euo pipefail
          bash -n Docker/star.sh Docker/INICIAR-STAR.command Docker/scripts/build-android.sh
          bash -n Docker/scripts/publish-docker-release.sh Docker/scripts/prepare-releases.sh
          grep -q 'AS desktop-renderer' 'Star web/star_app_proxy/Dockerfile'
          test -f 'Star mobile/pubspec.yaml'
          test -f 'Star Server/packaging/monolith/Dockerfile'
          if git ls-files --error-unmatch Docker/.env >/dev/null 2>&1; then
            echo 'Do not commit private Docker/.env' >&2
            exit 1
          fi
          cp Docker/.env.example Docker/.env
          trap 'rm -f Docker/.env' EXIT
          docker compose -f Docker/compose.yaml config --quiet
          docker compose -f Docker/compose.ghcr.yaml config --quiet
          echo 'Configuration and syntax verified.'

  prepare-release:
    name: Release / create artifacts and metadata
    if: github.event_name != 'pull_request' && inputs.target != 'backfill'
    needs: [validate, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Prepare artifact and metadata Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: bash Docker/scripts/prepare-releases.sh
          fi

  web-image:
    name: GHCR / web assets
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.apps == 'true' }}
    needs: [prepare-release, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable and latest tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/star-web-assets
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push component
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: './Star web'
          file: './Star web/star_app_proxy/Dockerfile'
          target: app-assets
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUNDLE_LOCAL_ASSETS=true
            PUBLIC_ASSET_BASE_URL=
            BUILD_VERSION=0.0.${{ github.run_number }}
          cache-from: type=gha,scope=web-assets
          cache-to: type=gha,scope=web-assets,mode=min
          provenance: true

      - name: Attach this image to the release immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: web-assets
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[[:xdigit:]]{64}$ ]] || {
            echo "Invalid or missing image digest" >&2
            exit 1
          }
          tag="star-meta-${GITHUB_SHA:0:8}"
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/star-${COMPONENT}"
          versioned_tag="sha-${GITHUB_SHA:0:7}"
          filename="star-${COMPONENT}-${GITHUB_SHA:0:8}.json"

          jq -n \
            --arg component "$COMPONENT" \
            --arg commit "$GITHUB_SHA" \
            --arg name "$name" \
            --arg tag "$versioned_tag" \
            --arg digest "$IMAGE_DIGEST" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: 1,
              component: $component,
              source_commit: $commit,
              platform: "linux/amd64",
              published_at: $published,
              registry: "ghcr.io",
              image: $name,
              tag: ($name + ":" + $tag),
              digest: $digest,
              immutable_image: ($name + "@" + $digest),
              pull_command: ("docker pull " + $name + "@" + $digest)
            }' > "$filename"
          gh release upload "$tag" "$filename" --clobber

          printf "### Imagem GHCR publicada\n\n- Componente: `%s`\n- Digest: `%s`\n- JSON: Release `star-meta-%s`\n" "$COMPONENT" "$IMAGE_DIGEST" "${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"

  desktop-image:
    name: GHCR / desktop renderer
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.apps == 'true' }}
    needs: [prepare-release, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable and latest tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/star-desktop-renderer
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push component
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: './Star web'
          file: './Star web/star_app_proxy/Dockerfile'
          target: desktop-renderer
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=0.0.${{ github.run_number }}
          cache-from: type=gha,scope=desktop-renderer
          cache-to: type=gha,scope=desktop-renderer,mode=min
          provenance: true

      - name: Attach this image to the release immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: desktop-renderer
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[[:xdigit:]]{64}$ ]] || {
            echo "Invalid or missing image digest" >&2
            exit 1
          }
          tag="star-meta-${GITHUB_SHA:0:8}"
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/star-${COMPONENT}"
          versioned_tag="sha-${GITHUB_SHA:0:7}"
          filename="star-${COMPONENT}-${GITHUB_SHA:0:8}.json"

          jq -n \
            --arg component "$COMPONENT" \
            --arg commit "$GITHUB_SHA" \
            --arg name "$name" \
            --arg tag "$versioned_tag" \
            --arg digest "$IMAGE_DIGEST" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: 1,
              component: $component,
              source_commit: $commit,
              platform: "linux/amd64",
              published_at: $published,
              registry: "ghcr.io",
              image: $name,
              tag: ($name + ":" + $tag),
              digest: $digest,
              immutable_image: ($name + "@" + $digest),
              pull_command: ("docker pull " + $name + "@" + $digest)
            }' > "$filename"
          gh release upload "$tag" "$filename" --clobber

          printf "### Imagem GHCR publicada\n\n- Componente: `%s`\n- Digest: `%s`\n- JSON: Release `star-meta-%s`\n" "$COMPONENT" "$IMAGE_DIGEST" "${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"

      # Native DMG/EXE runners cannot run Linux containers. Extract the
      # immutable renderer image on Linux and transport *its contents* to them.
      - name: Extract desktop renderer from published OCI image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/star-desktop-renderer@${IMAGE_DIGEST}"
          docker pull "$image"
          cid="$(docker create "$image")"
          trap 'docker rm "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$RUNNER_TEMP/desktop-renderer"
          docker cp "$cid:/renderer/." "$RUNNER_TEMP/desktop-renderer/"
          test -s "$RUNNER_TEMP/desktop-renderer/index.html"
          test -s "$RUNNER_TEMP/desktop-renderer/version.json"
          test -d "$RUNNER_TEMP/desktop-renderer/assets"
          tar -czf "$RUNNER_TEMP/desktop-renderer.tar.gz" -C "$RUNNER_TEMP/desktop-renderer" .

      - name: Export compiled renderer for macOS and Windows jobs
        uses: actions/upload-artifact@v4
        with:
          name: star-desktop-renderer
          path: ${{ runner.temp }}/desktop-renderer.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  mobile-image:
    name: GHCR / Android builder
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.apps == 'true' }}
    needs: [prepare-release, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable and latest tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/star-mobile-builder
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push component
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: './Docker'
          file: './Docker/Dockerfile.mobile'
          target: ''
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=0.0.${{ github.run_number }}
          cache-from: type=gha,scope=mobile-builder
          cache-to: type=gha,scope=mobile-builder,mode=min
          provenance: true

      - name: Attach this image to the release immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: mobile-builder
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[[:xdigit:]]{64}$ ]] || {
            echo "Invalid or missing image digest" >&2
            exit 1
          }
          tag="star-meta-${GITHUB_SHA:0:8}"
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/star-${COMPONENT}"
          versioned_tag="sha-${GITHUB_SHA:0:7}"
          filename="star-${COMPONENT}-${GITHUB_SHA:0:8}.json"

          jq -n \
            --arg component "$COMPONENT" \
            --arg commit "$GITHUB_SHA" \
            --arg name "$name" \
            --arg tag "$versioned_tag" \
            --arg digest "$IMAGE_DIGEST" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: 1,
              component: $component,
              source_commit: $commit,
              platform: "linux/amd64",
              published_at: $published,
              registry: "ghcr.io",
              image: $name,
              tag: ($name + ":" + $tag),
              digest: $digest,
              immutable_image: ($name + "@" + $digest),
              pull_command: ("docker pull " + $name + "@" + $digest)
            }' > "$filename"
          gh release upload "$tag" "$filename" --clobber

          printf "### Imagem GHCR publicada\n\n- Componente: `%s`\n- Digest: `%s`\n- JSON: Release `star-meta-%s`\n" "$COMPONENT" "$IMAGE_DIGEST" "${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"

  server-image:
    name: GHCR / server
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.server == 'true' }}
    needs: [prepare-release, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable and latest tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/star-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push component
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: './Star Server'
          file: './Star Server/packaging/monolith/Dockerfile'
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE=export
            PROFILE=release-fast
            CARGO_BUILD_JOBS=2
            BUILD_VERSION=0.0.${{ github.run_number }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=min
          provenance: true

      - name: Attach this image to the release immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: server
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[[:xdigit:]]{64}$ ]] || {
            echo "Invalid or missing image digest" >&2
            exit 1
          }
          tag="star-meta-${GITHUB_SHA:0:8}"
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/star-${COMPONENT}"
          versioned_tag="sha-${GITHUB_SHA:0:7}"
          filename="star-${COMPONENT}-${GITHUB_SHA:0:8}.json"

          jq -n \
            --arg component "$COMPONENT" \
            --arg commit "$GITHUB_SHA" \
            --arg name "$name" \
            --arg tag "$versioned_tag" \
            --arg digest "$IMAGE_DIGEST" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: 1,
              component: $component,
              source_commit: $commit,
              platform: "linux/amd64",
              published_at: $published,
              registry: "ghcr.io",
              image: $name,
              tag: ($name + ":" + $tag),
              digest: $digest,
              immutable_image: ($name + "@" + $digest),
              pull_command: ("docker pull " + $name + "@" + $digest)
            }' > "$filename"
          gh release upload "$tag" "$filename" --clobber

          printf "### Imagem GHCR publicada\n\n- Componente: `%s`\n- Digest: `%s`\n- JSON: Release `star-meta-%s`\n" "$COMPONENT" "$IMAGE_DIGEST" "${GITHUB_SHA:0:8}" >> "$GITHUB_STEP_SUMMARY"

  apk:
    name: Package / Android APK (ARM64)
    if: github.event_name != 'pull_request'
    needs: mobile-image
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Android APK inside published image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/star-mobile-builder:sha-${GITHUB_SHA:0:7}"
          docker pull "$image"
          mkdir -p "$RUNNER_TEMP/star-apk"
          docker run --rm --platform linux/amd64 \
            -e CI=true -e FLUTTER_SUPPRESS_ANALYTICS=true \
            -v "$GITHUB_WORKSPACE/Star mobile:/source:ro" \
            -v "$GITHUB_WORKSPACE/Star web:/source-web:ro" \
            -v "$RUNNER_TEMP/star-apk:/output" \
            "$image"
          test -s "$RUNNER_TEMP/star-apk/Star-Android-ARM64-DEBUG.apk"

      - name: Save downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Star-Android-ARM64-DEBUG
          path: ${{ runner.temp }}/star-apk/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Add APK to same GitHub Release immediately
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="star-build-${GITHUB_SHA:0:8}"
          gh release upload "$tag" "$RUNNER_TEMP/star-apk/Star-Android-ARM64-DEBUG.apk" --clobber
          gh release view "$tag" --json assets --jq '.assets[].name' |
            grep -Fxq 'Star-Android-ARM64-DEBUG.apk'
          echo "Verified debug APK in GitHub Release $tag" >> "$GITHUB_STEP_SUMMARY"

  archive-web-assets:
    name: Release / Docker image - web
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.apps == 'true' }}
    needs: [web-image, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout release exporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export compressed Docker image and upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: web-assets
        run: bash Docker/scripts/publish-docker-release.sh

  archive-desktop-renderer:
    name: Release / Docker image - desktop
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.apps == 'true' }}
    needs: [desktop-image, detect]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout release exporter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Export compressed Docker image and upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: desktop-renderer
        run: bash Docker/scripts/publish-docker-release.sh

  archive-mobile-builder:
    name: Release / Docker image - Android
    if: ${{ github.event_name != 'pull_request' && needs.detect.outputs.apps == 'true' }}
    needs: [mobile-image, detect]
    runs-on: ubuntu-24.04
