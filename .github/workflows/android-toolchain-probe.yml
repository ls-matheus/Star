# Diagnostic-only workflow. Does not rebuild the expensive Docker images.
name: Diagnose Android Docker Toolchain

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing GHCR image tag to test"
        type: string
        default: "sha-d56d2e7"
        required: true

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reproduce native-assets Cargo spawn in published Docker image
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/star-mobile-builder:${IMAGE_TAG}"
          docker pull "$image"
          docker run --rm --platform linux/amd64 --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE/Star web:/source-web:ro" \
            -v "$GITHUB_WORKSPACE/Star mobile:/source:ro" \
            "$image" -euc '
              printf "PATH=%s\nCARGO_HOME=%s\n" "$PATH" "$CARGO_HOME"
              command -v cargo || true
              ls -l /usr/local/cargo/bin/cargo /usr/local/bin/cargo /usr/bin/cargo 2>/dev/null || true
              rustup target list --installed
              mkdir -p /work/packages/star_markdown_native
              ln -s /source-web /work/star
              test -f /work/star/packages/markdown_parser/rust/Cargo.toml
              ls -ld /work/star/packages/markdown_parser/rust
              cat > /tmp/cargo_probe.dart <<'"'"'DART'"'"'
          import "dart:io";
          Future<void> probe(String path) async {
            try {
              final result = await Process.run(
                path, ["--version"],
                workingDirectory: "/work/star/packages/markdown_parser/rust",
                environment: {"CARGO_TARGET_DIR": "/tmp/cargo-target"},
              );
              stdout.writeln("EXE=$path CODE=${result.exitCode} OUT=${result.stdout} ERR=${result.stderr}");
            } catch (error) {
              stdout.writeln("EXE=$path FAILED: $error");
            }
          }
          Future<void> main() async {
            stdout.writeln("DART_PATH=${Platform.environment["PATH"]}");
            await probe("cargo");
            await probe("/usr/local/cargo/bin/cargo");
          }
          DART
              dart /tmp/cargo_probe.dart
            '
