# Reusable GHCR publisher. One invocation = one independent image and release asset.
name: Publish one Docker component

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      target:
        required: true
        type: string
      build_args:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build and publish ${{ inputs.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable and latest tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/star-${{ inputs.component }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Build and push component
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          target: ${{ inputs.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ inputs.build_args }}
            BUILD_VERSION=0.0.${{ github.run_number }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,scope=${{ inputs.component }},mode=min
          provenance: true

      - name: Attach this image to the release immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMPONENT: ${{ inputs.component }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[[:xdigit:]]{64}$ ]] || {
            echo "Invalid or missing image digest" >&2
            exit 1
          }
          tag="star-build-${GITHUB_SHA:0:8}"
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/star-${COMPONENT}"
          versioned_tag="sha-${GITHUB_SHA:0:7}"
          filename="star-${COMPONENT}-${GITHUB_SHA:0:8}.json"

          jq -n \
            --arg component "$COMPONENT" \
            --arg commit "$GITHUB_SHA" \
            --arg name "$name" \
            --arg tag "$versioned_tag" \
            --arg digest "$IMAGE_DIGEST" \
            --arg published "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schema_version: 1,
              component: $component,
              source_commit: $commit,
              platform: "linux/amd64",
              published_at: $published,
              registry: "ghcr.io",
              image: $name,
              tag: ($name + ":" + $tag),
              digest: $digest,
              immutable_image: ($name + "@" + $digest),
              pull_command: ("docker pull " + $name + "@" + $digest)
            }' > "$filename"
          gh release upload "$tag" "$filename" --clobber

          echo "Published ${name}@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      # Native DMG/EXE runners cannot run Linux containers. Extract the
      # immutable renderer image on Linux and transport *its contents* to them.
      - name: Extract desktop renderer from published OCI image
        if: inputs.component == 'desktop-renderer'
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/star-desktop-renderer@${IMAGE_DIGEST}"
          docker pull "$image"
          cid="$(docker create "$image")"
          trap 'docker rm "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$RUNNER_TEMP/desktop-renderer"
          docker cp "$cid:/renderer/." "$RUNNER_TEMP/desktop-renderer/"
          test -s "$RUNNER_TEMP/desktop-renderer/index.html"
          test -s "$RUNNER_TEMP/desktop-renderer/version.json"
          test -d "$RUNNER_TEMP/desktop-renderer/assets"
          tar -czf "$RUNNER_TEMP/desktop-renderer.tar.gz" -C "$RUNNER_TEMP/desktop-renderer" .

      - name: Export compiled renderer for macOS and Windows jobs
        if: inputs.component == 'desktop-renderer'
        uses: actions/upload-artifact@v4
        with:
          name: star-desktop-renderer
          path: ${{ runner.temp }}/desktop-renderer.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
