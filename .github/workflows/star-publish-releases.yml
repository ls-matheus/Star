# Publica os binarios produzidos pelo workflow principal na aba Releases.
# Nenhum README ou release note e gerado; a descricao da release fica vazia.
name: 'Star | Publicar em Releases'

on:
  workflow_run:
    workflows:
      - 'Star | Builds automaticos (APK, DMG, EXE)'
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID da execucao de compilacao que deseja publicar'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: star-release-${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  release:
    name: 'Publicar APK, DMG e EXE'
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}

    steps:
      - name: 'Validar execucao original e verificar artefatos'
        id: source
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID")"
          workflow="$(jq -r '.name' <<< "$run_json")"
          branch="$(jq -r '.head_branch' <<< "$run_json")"
          source_repo="$(jq -r '.head_repository.full_name' <<< "$run_json")"
          status="$(jq -r '.status' <<< "$run_json")"
          conclusion="$(jq -r '.conclusion' <<< "$run_json")"
          source_sha="$(jq -r '.head_sha' <<< "$run_json")"
          run_number="$(jq -r '.run_number' <<< "$run_json")"
          if [[ "$workflow" != 'Star | Builds automaticos (APK, DMG, EXE)' ||
                "$branch" != 'main' || "$source_repo" != "$GH_REPO" ||
                "$status" != 'completed' ]]; then
            echo 'A execucao informada nao corresponde a um build Star concluido da main.' >&2
            exit 1
          fi
          if [[ "$conclusion" == 'cancelled' || "$conclusion" == 'skipped' ]]; then
            echo 'Execucao cancelada ou ignorada: nenhuma Release sera criada.'
            echo 'has_assets=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          artifacts="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/artifacts")"
          count="$(jq '[.artifacts[]
            | select(.expired == false)
            | select(.name | test("^Star-(Android-APK|macOS-Intel-DMG|Windows-EXE)-"))] | length' <<< "$artifacts")"
          if [[ "$count" -eq 0 ]]; then
            echo 'Nenhum instalador foi gerado; nenhuma Release sera criada.'
            echo 'has_assets=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'has_assets=true' >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "run_number=$run_number" >> "$GITHUB_OUTPUT"
          echo "Encontrados $count artefatos da execucao $SOURCE_RUN_ID."

      - name: 'Baixar os instaladores do build'
        if: steps.source.outputs.has_assets == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: 'Star-*'
          merge-multiple: true
          path: release-assets

      - name: 'Criar ou atualizar a Release sem notas'
        if: steps.source.outputs.has_assets == 'true'
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.source.outputs.source_sha }}
          RELEASE_NUMBER: ${{ steps.source.outputs.run_number }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=()
          for asset in release-assets/*.apk release-assets/*.dmg release-assets/*.exe release-assets/*.zip; do
            [[ -s "$asset" ]] || continue
            assets+=("$asset")
          done
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo 'Nenhum arquivo de instalacao encontrado nos artefatos.' >&2
            exit 1
          fi
          tag="star-build-$RELEASE_NUMBER"
          title="Star Build $RELEASE_NUMBER"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --title "$title" --notes ''
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$RELEASE_SHA" \
              --title "$title" \
              --notes '' \
              --prerelease
          fi
          echo "Release disponivel: https://github.com/$GH_REPO/releases/tag/$tag"
