{{- include "star.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: star-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "star.labels" (dict "root" . "name" "star-config" "component" "config") | nindent 4 }}
data:
  {{- include "star.configData" . | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: star-app-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "star.labels" (dict "root" . "name" "star-app-proxy" "component" "config") | nindent 4 }}
data:
  {{- include "star.appProxyConfigData" . | nindent 2 }}
